# ARTEX Tencent TSec Benchmark image — one-command local build + run.
# Independent of the production docker-compose.yml (multi-service: artex + postgres).
# Usage:
#   cp bench/.env.example bench/.env   # fill in LLM_API_KEY / BENCHMARK_TOKEN, etc.
#   docker compose -f docker-compose.bench.yml up --build      # build and run in the foreground (logs)
#   docker compose -f docker-compose.bench.yml up --build -d   # background
#   docker compose -f docker-compose.bench.yml logs -f
#   docker compose -f docker-compose.bench.yml down            # stop (add -v to remove volumes too)
# Browser: http://localhost:8787 (log in with ADMIN_PASSWORD)

services:
  artex-bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    image: artex-bench:latest
    container_name: artex-bench
    env_file:
      - bench/.env
    # Share the host's network stack so the container can reach target machines on the
    # host or its VPN directly. In host mode there are no port mappings: the container
    # binds host ports directly — 8787 (UI/API), 8788 (proxy), and the internal
    # PostgreSQL 5432. Make sure those three ports are free before a local run.
    network_mode: host
    restart: "no"

volumes:
  artex_bench_data:
