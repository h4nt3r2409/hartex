services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artex:
    # Image published to GitHub Container Registry for each release tag (v*) by this
    # fork (.github/workflows/release.yml's docker job). Upstream autumn27/artex is gone
    # from Docker Hub.
    # Production should pin ARTEX_TAG to a release tag (for example v0.4.0-global.1).
    # ARTEX_TAG=edge follows the continuous main-branch image.
    image: ghcr.io/h4nt3r2409/hartex:${ARTEX_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
      # First-run protection. When empty, startup logs print a random setup token; enter
      # it at /setup to create the admin password (see `docker compose logs artex`).
      # Setting ARTEX_ADMIN_PASSWORD initialises that password directly, skipping /setup
      # (minimum 8 characters).
      ARTEX_SETUP_TOKEN: ${ARTEX_SETUP_TOKEN:-}
      ARTEX_ADMIN_PASSWORD: ${ARTEX_ADMIN_PASSWORD:-}
      # Browser cross-origin allowlist (comma-separated). The embedded UI is same-origin,
      # so this is normally left empty.
      ARTEX_CORS_ORIGINS: ${ARTEX_CORS_ORIGINS:-}
    ports:
      # By default the port is published only on the host's 127.0.0.1. To connect from
      # another machine, set ARTEX_BIND=0.0.0.0 in .env — but finish initial setup (admin
      # password) first, and preferably use the README's reverse-proxy (HTTPS) setup.
      - "${ARTEX_BIND:-127.0.0.1}:8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # Bind the data directory (jwt.key, SQLite, etc.) to ./data in the project root.
      # It can be inspected and backed up from the host and survives container recreation.
      - ./data:/app/data
      # Mount the project-root skills/ into the container (overriding the image's
      # /app/skills). Editing a skill requires no image rebuild; the container reads the
      # host files directly.
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
